global:
  scrape_interval: 5s

scrape_configs:
  - job_name: planner
    static_configs:
      - targets: ["planner-service:8001"]
  - job_name: routing
    static_configs:
      - targets: ["routing-service:8002"]
  - job_name: solver
    static_configs:
      - targets: ["solver-service:8003"]
  - job_name: ai
    static_configs:
      - targets: ["ai-service:8004"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
